<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="An animated terminal showing: whoami returns DUNG30N5; systems --public --count returns 136 public, 16 private, 0 forks; signal --measured returns 2,032 verified tests, 6 green CI, 9 releases; portfolio economics returns a caveated base figure; then why-are-you-here.">
