      <stop offset="52%" stop-color="#7C8CFF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="av-node-bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7C8CFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
