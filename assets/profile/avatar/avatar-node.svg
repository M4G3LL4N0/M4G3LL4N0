<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Abstract spectral node avatar candidate"><title id="t">Abstract spectral node avatar candidate</title><desc id="d">A central node linked to four outer nodes by thin spectral lines, on a dark liquid-glass field.</desc>
  <defs>
    <linearGradient id="av-node-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EE7D0" stop-opacity="0"/>
      <stop offset="45%" stop-color="#5EE7D0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7C8CFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="av-node-body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1C2330" stop-opacity="0.085"/>
      <stop offset="55%" stop-color="#161B22" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#161B22" stop-opacity="0.033"/>
    </linearGradient>
