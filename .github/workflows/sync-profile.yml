name: sync-profile

# Regenerates the bounded GitHubOS block in README.md from the GitHub API.
#
# Two rules this workflow exists to enforce:
#
#   1. Only content between the githubos markers is ever rewritten. Anything a
#      human wrote by hand is left alone.
#   2. A commit is only made when the content actually changed. An unchanged
#      profile produces no commit, which keeps the contribution graph honest
#      instead of manufacturing green squares.

on:
  schedule:
    # 07:14 UTC daily. Deliberately not on the hour, to avoid the top-of-hour
    # scheduling spike every scheduled workflow lands on.
    - cron: "14 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-profile
  cancel-in-progress: true

jobs:
  sync:
    name: regenerate generated sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GITHUB_TOKEN is an installation token scoped to this one repository.
      # It cannot enumerate the owner's repositories (403), so it can only ever
      # see this repo. A classic PAT with `repo` scope is required to build the
      # full inventory.
      #
      # Store one as the GH_PAT secret on this repository:
      #   Settings -> Secrets and variables -> Actions -> New repository secret
      # Without it the job still succeeds and leaves the profile untouched,
      # which is why a missing secret shows up as a warning rather than a red X.
      - name: Enumerate repositories
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! gh api "repos/${{ github.repository_owner }}/repos?per_page=100&type=all" --paginate \
               > repos-raw.json; then
            echo "::warning::could not list repositories. Add a GH_PAT secret with repo scope to enable the full inventory."
            echo '{"skipped": true}' > inventory.json
            exit 0
          fi
          python3 - <<'PY'
          import json
          repos = json.load(open("repos-raw.json"))
          assert isinstance(repos, list) and repos, "expected a non-empty array"
          open("repos-raw.json", "w").write(json.dumps(repos))
          print(f"fetched {len(repos)} repos")
          PY

      # Each public repo is inspected once. Test counts are deliberately NOT
      # fetched from the API: no GitHub endpoint reports "number of tests", so
      # they are read from tests.json, which an operator fills in after running
      # the suite for real.
      - name: Enrich with root files, CI, and releases
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! python3 scripts/enrich_snapshot.py repos-raw.json > repos.json; then
            echo "::warning::could not enrich snapshot; leaving profile unchanged"
            echo '{"skipped": true}' > inventory.json
            exit 0
          fi
          python3 -c "import json;print('enriched', len(json.load(open('repos.json'))), 'repos')"

      # Project-site repositories are deployment surfaces, not portfolio systems.
      # Keep them out of public-system counts and generated profile tables even
      # if one is temporarily public while visibility is being corrected.
      - name: Exclude site-only repositories from public signal
        run: |
          python3 - <<'PY'
          import json
          path = "repos.json"
          repos = json.load(open(path))
          kept = [r for r in repos if not str(r.get("name", "")).lower().endswith("-website")]
          excluded = sorted(r.get("name", "") for r in repos if r not in kept)
          open(path, "w").write(json.dumps(kept))
          print(f"excluded {len(excluded)} site-only repositories: {', '.join(excluded)}")
          PY

      # Portfolio OS is PRIVATE: its name is on the publication denylist, so an
      # unauthenticated `git clone` now returns 401 and the whole sync would
      # fail. actions/checkout carries the job token, which is scoped to this
      # repository and can read the private one.
      - name: Install Portfolio OS
        uses: actions/checkout@v4
        with:
          repository: M4G3LL4N0/noaerth-portfolio-os
          path: /tmp/pos
          persist-credentials: false

      - name: Render the generated block
        run: |
          if grep -q '"skipped"' inventory.json 2>/dev/null; then
            echo "snapshot unavailable, nothing to render"
            exit 0
          fi
          PYTHONPATH=/tmp/pos python3 -m portfolio_os githubos scan repos.json --out inventory.json
          PYTHONPATH=/tmp/pos python3 -m portfolio_os githubos render inventory.json \
            --profile README.md \
            --pins "agentos,grokinstall,grokmax,gh0st,opencode-watchdog"

      # The identity is generated, not hand-drawn. Every number in the artwork
      # is read from the inventory and tests.json; no SVG contains a literal
      # metric, so the graphics cannot drift from the repositories they describe.
      # ROOT CAUSE OF THE ART REVERSION, FIXED.
      #
      # This step used to run `generate.py`, which regenerates the hero, system
      # map, terminal and every card, then committed the result. Its commit
      # message claimed "no hand-authored content is modified", which was false.
      # An approved hero could therefore be replaced by whatever the generator
      # emitted that day, silently, on a schedule.
      #
      # The fix is architectural rather than cosmetic: scheduled automation no
      # longer runs the design generator at all. It updates only the factual
      # signal -- measured test counts, release versions, CI state -- and the
      # bounded README regions that own those facts. Design-controlled assets
      # are produced by an explicit, human-initiated run and are hash-locked.
      - name: Update factual signal only (design assets untouched)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '"skipped"' inventory.json 2>/dev/null; then
            echo "snapshot unavailable, signal left unchanged"
            exit 0
          fi
          python3 scripts/profile_art/build_signal_data.py --inventory
          python3 scripts/profile_art/render_signal_block.py

      - name: Enforce art lock
        run: |
          set -euo pipefail
          python3 scripts/profile_art/art_lock.py --verify

      # The upstream block is regenerated from the signal rather than written by
      # hand, so "no external merged contributions" removes the section instead
      # of leaving an empty decorative heading behind.
      - name: Refresh the upstream block
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile_art/render_upstream_block.py

      # Runs after regeneration so it validates what was just written, not what
      # was committed yesterday. A failure here means the next commit would have
      # published something broken, which is exactly when to stop.
      - name: Verify profile integrity
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Commit only if content changed
        run: |
          if git diff --quiet -- README.md \
              assets/profile/build-signal.json \
              assets/profile/build-signal-dark.svg \
              assets/profile/build-signal-light.svg; then
            echo "Generated sections unchanged. No commit."
            exit 0
          fi
          # Housekeeping commits stay attributed to the bot. A human or an
          # OpenCode engineering commit is authored normally; an automated
          # metric refresh must never look like a person typed it.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only what automation is allowed to change. `git add
          # assets/profile` swept in every design-controlled asset, which is
          # how a regenerated hero got committed as housekeeping.
          git add README.md \
            assets/profile/build-signal.json \
            assets/profile/build-signal-dark.svg \
            assets/profile/build-signal-light.svg
          cat > /tmp/commit-message.txt <<'MSG'
          docs(profile): sync measured metrics

          Automated refresh of factual state only: test counts, release
          versions, CI status, and the bounded README regions that render
          them.

          Design-controlled assets -- hero, system map, terminal, cards,
          windows, nav, social preview -- are NOT regenerated here and are
          hash-locked by scripts/profile_art/art_lock.py. An earlier version of
          this job ran the design generator and committed its output while
          claiming no hand-authored content was modified. That was the cause of
          a reverted hero, and it is now structurally impossible.

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          MSG
          git commit -F /tmp/commit-message.txt
          git push

      - name: Upload the inventory as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: githubos-inventory
          path: inventory.json
          retention-days: 30
