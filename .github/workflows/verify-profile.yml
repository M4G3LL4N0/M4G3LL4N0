name: verify-profile

# Runs the profile integrity suite on every push and pull request.
#
# This is separate from sync-profile.yml on purpose: sync-profile mutates the
# repository and runs on a schedule, so it must never be the thing that decides
# whether a change is safe. This workflow is read-only and fast.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: asset, link, contrast and evidence integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No third-party dependencies on purpose. A profile test suite that needs
      # an install step is a suite that silently stops running.
      - name: Verify profile integrity
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/github_art/test_v5_safety.py

      # The V5 design system must regenerate every chosen asset byte-identically.
      # Comparing hashes against a committed manifest is the only check that
      # works: build/ is gitignored, so a git-diff gate would silently pass even
      # if the generator produced something entirely different.
      - name: V5 art is reproducible
        run: |
          set -euo pipefail
          python3 scripts/github_art/build_gallery.py > /dev/null
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(".")
          expected = json.loads(
              (root / "scripts/github_art/asset_manifest.json").read_text())
          actual = {
              str(p): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted((root / "build" / "v5-chosen").rglob("*.svg"))
          }
          if expected == actual:
              print(f"{len(actual)} assets reproduce byte-identically")
              sys.exit(0)
          for name in sorted(set(expected) | set(actual)):
              if expected.get(name) != actual.get(name):
                  state = ("added" if name not in expected else
                           "removed" if name not in actual else "changed")
                  print(f"::error::{name} {state}")
          sys.exit(1)
          PY

      # Regenerating must be a no-op. If the committed artwork differs from what
      # the generator produces, the repository is lying about its own contents.
      # Design-controlled assets must not drift without an explicit lock move.
      # Runs before the reproducibility gate so a reverted hero is reported as a
      # lock violation rather than as a hash mismatch.
      # Product repositories are read-only evidence this round. This gate
      # fails if any product source, manifest, lockfile, framework config or
      # product test changed, so drift into product repair is caught rather
      # than noticed later.
      - name: Product code freeze holds
        run: |
          set -euo pipefail
          python3 scripts/profile_art/freeze_guard.py --verify

      # A GitHub push must never become a production deployment. 78 Vercel
      # projects were once wired to repositories here, and presentation commits
      # were deploying to production. This gate makes that unrepeatable.
      - name: No git-triggered Vercel deployment
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/profile_art/vercel_guard.py --json /tmp/vercel.json

      - name: Art lock holds
        run: |
          set -euo pipefail
          python3 scripts/profile_art/art_lock.py --verify

      - name: Artwork is reproducible
        run: |
          set -euo pipefail
          python3 scripts/profile_art/generate.py > /dev/null

          # Both tracked modifications AND untracked new files must be caught.
          # `git diff --quiet` alone only sees tracked files, so a generator that
          # starts emitting a new asset is invisible to it: that is exactly how
          # assets/profile/cards/, assets/profile/avatar/ and
          # assets/profile/nav/open-source-*.svg came to exist uncommitted and
          # unverified.
          changed=$(git status --porcelain -- assets/profile assets/social-preview.svg)
          if [ -n "$changed" ]; then
            echo "::error::regenerating changed the committed artwork. Run scripts/profile_art/generate.py and commit the result."
            echo "$changed"
            exit 1
          fi

          # Generating twice in the same tree must be a no-op. This catches
          # nondeterminism that a single run cannot: unordered set or dict
          # iteration, time or date stamps, RNG without a fixed seed, and
          # environment-dependent paths baked into output.
          before=$(find assets/profile assets/social-preview.svg -type f -exec sha256sum {} + | LC_ALL=C sort | sha256sum)
          python3 scripts/profile_art/generate.py > /dev/null
          after=$(find assets/profile assets/social-preview.svg -type f -exec sha256sum {} + | LC_ALL=C sort | sha256sum)
          if [ "$before" != "$after" ]; then
            echo "::error::generating twice produced different bytes; the generator is not deterministic"
            exit 1
          fi
          echo "committed artwork matches the generator, and generation is deterministic"

      # The zero-missing invariants. These fail loudly rather than reporting a
      # number, because a silently truncated source is how 52 repositories went
      # missing from a previous report.
      - name: Inventory sources reconcile
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          python3 scripts/profile_art/reconcile_inventory.py --json reconcile.json

      - name: Zero-missing ledger invariant holds
        # No token needed: this verifies the committed ledger against its own
        # invariants, which is the contract that must hold unconditionally.
        run: |
          set -euo pipefail
          python3 scripts/profile_art/build_account_ledger.py --check

      - name: Generated README blocks are up to date
        run: |
          set -euo pipefail
          python3 scripts/profile_art/render_signal_block.py
          python3 scripts/profile_art/render_upstream_block.py
          if ! git diff --quiet -- README.md; then
            echo "::error::README generated blocks are stale. Re-run the render_signal_block.py and render_upstream_block.py scripts."
            git diff -- README.md
            exit 1
          fi
          echo "README generated blocks match their source data"
